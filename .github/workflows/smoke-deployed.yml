name: Smoke test (deployed sites)

# Checks that production and staging still boot PostgreSQL and serve the build of the
# right branch. Runs daily, after a push to main or staging (once Cloudflare has had
# time to deploy), and on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *' # 09:00 Asia/Bangkok
  push:
    branches: [main, staging]

permissions:
  contents: read
  checks: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same image as CI: browsers and their libraries are already inside.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: production
            branch: main
            url: https://data-desk.pages.dev
          - env: staging
            branch: staging
            url: https://staging.data-desk.pages.dev
    steps:
      # On a push, only check the site that push deploys.
      - name: Skip the other environment
        id: gate
        run: echo "run=${{ github.event_name != 'push' || github.ref_name == matrix.branch }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      # Cloudflare Pages reports its build as a check run on the commit; wait for it to finish.
      # (Plain Node: the Playwright image has no gh CLI.)
      - name: Wait for Cloudflare Pages to deploy this commit
        if: steps.gate.outputs.run == 'true' && github.event_name == 'push'
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_URL: ${{ github.api_url }}/repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs
        run: |
          node -e '
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            (async () => {
              for (let i = 0; i < 60; i++) {
                const res = await fetch(process.env.CHECKS_URL, { headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json" } });
                const run = (await res.json()).check_runs?.find((c) => c.name === "Cloudflare Pages");
                const state = run ? `${run.status}/${run.conclusion}` : "not started";
                console.log("Cloudflare Pages:", state);
                if (state === "completed/success") { await sleep(20000); return; }
                if (run?.status === "completed") { console.log(`::error::Cloudflare Pages deploy did not succeed (${state})`); process.exit(1); }
                await sleep(15000);
              }
              console.log("::error::Timed out waiting for Cloudflare Pages");
              process.exit(1);
            })();
          '
      - run: npx playwright test --project=chromium --grep @smoke
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_BASE_URL: ${{ matrix.url }}
          E2E_EXPECT_ENV: ${{ matrix.env }}
